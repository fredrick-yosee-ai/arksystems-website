<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <!-- Soft drop shadow for the cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    /* Global Styles */
    .box { 
      fill: #FFFFFF; 
      stroke: #E5E7EB; 
      stroke-width: 1.5px; 
      filter: url(#shadow); 
    }
    .box-highlight { 
      fill: #FFFFFF; 
      stroke: #D99B29; 
      stroke-width: 2.5px; 
      filter: url(#shadow); 
    }
    .text-title { 
      font-family: system-ui, -apple-system, sans-serif; 
      font-size: 22px; 
      font-weight: 600; 
      fill: #111827; 
      text-anchor: middle; 
    }
    .text-large { 
      font-family: system-ui, -apple-system, sans-serif; 
      font-size: 26px; 
      font-weight: 600; 
      fill: #111827; 
      text-anchor: start; 
      dominant-baseline: middle;
    }
    .line { 
      fill: none; 
      stroke: #1E3F24; 
      stroke-width: 3.5px; 
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-stroke { 
      fill: none; 
      stroke: #1E3F24; 
      stroke-width: 3px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .icon-bg { 
      fill: #E8F0E5; 
    }
    .icon-fill-dark {
      fill: #557256;
    }
    .check-circle { 
      fill: #2F5233; 
      stroke: #FFFFFF; 
      stroke-width: 3px; 
    }
    .check-mark { 
      fill: none; 
      stroke: #FFFFFF; 
      stroke-width: 3px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
  </style>

  <!-- ================= INPUT SOURCES (TOP ROW) ================= -->

  <!-- Email Input -->
  <g transform="translate(110, 80)">
    <rect class="box" width="200" height="220" rx="16" />
    <!-- Light green circle background -->
    <circle cx="100" cy="95" r="45" class="icon-bg" />
    <text class="text-title" x="100" y="180">Email</text>
    
    <!-- Envelope Icon -->
    <g transform="translate(73, 77)">
      <rect class="icon-stroke" width="54" height="36" rx="4" />
      <path class="icon-stroke" d="M 0 0 L 27 18 L 54 0" />
    </g>
  </g>

  <!-- Client Portal Input -->
  <g transform="translate(350, 80)">
    <rect class="box" width="200" height="220" rx="16" />
    <circle cx="100" cy="95" r="45" class="icon-bg" />
    <text class="text-title" x="100" y="180">Client Portal</text>
    
    <!-- Browser & User Icon -->
    <g transform="translate(72, 75)">
      <rect class="icon-stroke" width="56" height="38" rx="4" />
      <line class="icon-stroke" x1="0" y1="12" x2="56" y2="12" />
      <circle cx="8" cy="6" r="2" fill="#1E3F24" />
      <circle cx="16" cy="6" r="2" fill="#1E3F24" />
      <circle cx="44" cy="24" r="6" fill="#1E3F24" />
      <path d="M 54 38 A 12 12 0 0 0 34 38 Z" fill="#1E3F24" />
    </g>
  </g>

  <!-- Spreadsheets Input -->
  <g transform="translate(590, 80)">
    <rect class="box" width="200" height="220" rx="16" />
    <circle cx="100" cy="95" r="45" class="icon-bg" />
    <text class="text-title" x="100" y="180">Spreadsheets</text>
    
    <!-- Grid Icon -->
    <g transform="translate(76, 71)">
      <rect class="icon-stroke" width="48" height="48" rx="4" />
      <line class="icon-stroke" x1="0" y1="16" x2="48" y2="16" />
      <line class="icon-stroke" x1="0" y1="32" x2="48" y2="32" />
      <line class="icon-stroke" x1="16" y1="16" x2="16" y2="48" />
      <line class="icon-stroke" x1="32" y1="16" x2="32" y2="48" />
    </g>
  </g>

  <!-- ================= MERGING CONNECTORS ================= -->

  <!-- Left (Email) path to center merge -->
  <path class="line" d="M 210 300 L 210 320 Q 210 340 230 340 L 450 340" />
  
  <!-- Right (Spreadsheets) path to center merge -->
  <path class="line" d="M 690 300 L 690 320 Q 690 340 670 340 L 450 340" />
  
  <!-- Middle (Portal) path straight down -->
  <line class="line" x1="450" y1="300" x2="450" y2="395" />
  
  <!-- Merge Intersection Dot -->
  <circle cx="450" cy="340" r="7" fill="#1E3F24" />

  <!-- Arrowhead Top to Row 2 -->
  <path class="line" d="M 436 381 L 450 395 L 464 381" />


  <!-- ================= PROCESS WORKFLOW ================= -->

  <!-- Row 2: Requested & Received -->
  <g transform="translate(160, 410)">
    <rect class="box" width="260" height="130" rx="16" />
    <text class="text-large" x="115" y="67">Requested</text>
    
    <!-- Document Icon -->
    <g transform="translate(45, 36)">
      <path class="icon-stroke" d="M 0 0 L 26 0 L 40 14 L 40 54 L 0 54 Z" fill="#F8FAF8" />
      <path class="icon-stroke" d="M 26 0 L 26 14 L 40 14" />
      <line class="icon-stroke" x1="10" y1="20" x2="22" y2="20" />
      <line class="icon-stroke" x1="10" y1="32" x2="30" y2="32" />
      <line class="icon-stroke" x1="10" y1="44" x2="30" y2="44" />
      <!-- Small Green Check -->
      <circle class="check-circle" cx="42" cy="52" r="14" />
      <path class="check-mark" stroke-width="2.5" d="M 36 52 L 40 56 L 47 47" />
    </g>
  </g>

  <!-- Arrow: Req -> Rec -->
  <line class="line" x1="435" y1="475" x2="465" y2="475" />
  <path class="line" d="M 451 461 L 465 475 L 451 489" />

  <!-- Received Box -->
  <g transform="translate(480, 410)">
    <rect class="box" width="260" height="130" rx="16" />
    <text class="text-large" x="115" y="67">Received</text>
    
    <!-- Folder Icon -->
    <g transform="translate(40, 44)">
      <path class="icon-stroke" d="M 0 0 L 16 0 L 22 8 L 48 8 L 48 44 L 0 44 Z" fill="#F8FAF8" />
      <path class="icon-stroke" d="M 0 12 L 48 12" />
      <!-- Solid folder fill representation -->
      <path d="M 2 13 L 46 13 L 46 42 L 2 42 Z" fill="#E8F0E5" />
      <!-- Small Green Check -->
      <circle class="check-circle" cx="48" cy="44" r="14" />
      <path class="check-mark" stroke-width="2.5" d="M 42 44 L 46 48 L 53 39" />
    </g>
  </g>

  <!-- Connector Row 2 -> Row 3 -->
  <line class="line" x1="450" y1="540" x2="450" y2="580" />
  <path class="line" d="M 436 566 L 450 580 L 464 566" />


  <!-- Row 3: Missing Items -->
  <g transform="translate(160, 590)">
    <rect class="box-highlight" width="580" height="130" rx="16" />
    <text class="text-large" x="330" y="67">Missing Items</text>
    
    <!-- Large Exclamation Icon -->
    <g transform="translate(250, 65)">
      <circle cx="0" cy="0" r="32" fill="#D99B29" />
      <line x1="0" y1="-14" x2="0" y2="6" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <circle cx="0" cy="16" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Connector Row 3 -> Row 4 -->
  <line class="line" x1="450" y1="720" x2="450" y2="760" />
  <path class="line" d="M 436 746 L 450 760 L 464 746" />


  <!-- Row 4: Review -->
  <g transform="translate(160, 770)">
    <rect class="box" width="580" height="130" rx="16" />
    <text class="text-large" x="330" y="67">Review</text>
    
    <!-- People Icon -->
    <g transform="translate(250, 72)">
      <!-- Background Person -->
      <path d="M 32 0 A 20 20 0 0 0 -8 0 Z" fill="#E8F0E5" stroke="#1E3F24" stroke-width="2.5" stroke-linejoin="round" />
      <circle cx="12" cy="-32" r="14" fill="#E8F0E5" stroke="#1E3F24" stroke-width="2.5" />
      
      <!-- Foreground Person -->
      <path d="M 14 6 A 22 22 0 0 0 -38 6 Z" class="icon-fill-dark" />
      <circle cx="-12" cy="-28" r="16" class="icon-fill-dark" />
    </g>
  </g>

  <!-- Connector Row 4 -> Row 5 -->
  <line class="line" x1="450" y1="900" x2="450" y2="940" />
  <path class="line" d="M 436 926 L 450 940 L 464 926" />


  <!-- Row 5: Ready -->
  <g transform="translate(160, 950)">
    <rect class="box" width="580" height="130" rx="16" />
    <text class="text-large" x="330" y="67">Ready</text>
    
    <!-- Large Checkmark Icon -->
    <g transform="translate(250, 65)">
      <circle cx="0" cy="0" r="32" fill="#2F5233" />
      <path class="check-mark" stroke-width="4.5" d="M -12 2 L -4 10 L 14 -8" />
    </g>
  </g>

</svg>
