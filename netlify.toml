[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# ---------------------------------------------------------------------------
# Redirects from the paths the previous site served.
# Without these, existing inbound links and the search equity on them die.
# ---------------------------------------------------------------------------

# "How We Help" has no equivalent page in the rebuild. Its content is now the
# homepage's sections 2, 3 and 8, so the homepage is the honest destination.
# This move is permanent, so 301.
[[redirects]]
from = "/how-we-help"
to = "/"
status = 301
force = true

# /accounting has now shipped, so this is the permanent destination it was always
# meant to have. It was a temporary 302 to the homepage only because /accounting did
# not exist yet and a 301 to a 404 is cached hard by browsers and search engines.
[[redirects]]
from = "/accounting-firms"
to = "/accounting"
status = 301
force = true

# /workshop keeps its path in the rebuild, so it needs no redirect.
