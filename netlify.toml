[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# ---------------------------------------------------------------------------
# Redirects from the paths the previous site served.
# Without these, existing inbound links and the search equity on them die.
# ---------------------------------------------------------------------------

# "How We Help" has no equivalent page in the rebuild. Its content is now the
# homepage's sections 2, 3 and 8, so the homepage is the honest destination.
# This move is permanent, so 301.
[[redirects]]
from = "/how-we-help"
to = "/"
status = 301
force = true

# RELEASE ONE ONLY. The real destination is /accounting, but that page does not
# ship until release two, and a 301 to a 404 is worse than no redirect — browsers
# and search engines cache a 301 hard, so it would be difficult to correct later.
# 302 says "temporary, do not re-index", which is exactly true right now.
#
# WHEN /accounting SHIPS: change `to` to "/accounting" and `status` to 301.
[[redirects]]
from = "/accounting-firms"
to = "/"
status = 302
force = true

# /workshop keeps its path in the rebuild, so it needs no redirect.
